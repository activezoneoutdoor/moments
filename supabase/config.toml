# Settings for `supabase functions deploy`. The functions check access themselves
# (upload token or staff session), so the gateway's JWT check is turned off.
project_id = "moments"

[functions.upload-start]
verify_jwt = false

[functions.upload-finish]
verify_jwt = false

[functions.album-publish]
verify_jwt = false

[functions.media-thumbnail]
verify_jwt = false

[functions.event-photo]
verify_jwt = false

[functions.album-sync]
verify_jwt = false

[functions.send-emails]
verify_jwt = false
